<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Procurement Request</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto|Inter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="resource/base.css">
  <link rel="stylesheet" href="resource/step1.css">
  <link rel="stylesheet" href="resource/step2.css">
  <link rel="stylesheet" href="resource/step3.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">DICT PROCUREMENT</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">Dashboard</a>
      <a href="page1.html" class="nav-item active">New Request</a>
      <a href="profile.html" class="nav-item">My Profile</a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="header-container">
      <img src="images/header-banner.png" class="header-banner" alt="DICT Banner">
    </header>

    <div class="main-card-container">
      <div class="title-tab-wrapper">
        <p id="page-title" class="text-9">PROCUREMENT PROJECT DETAILS</p>
      </div>

      <div class="progress-section">
        <div class="track-4" style="width: 60%; margin: 20px auto;">
          <div id="progress-fill" class="filled-5" style="width: 15%; transition: width 0.3s ease;"></div>
        </div>
      </div>

      <!-- STEP 1: Procurement Project Details -->
      <div id="step-1">
        <form class="form-grid">
          <!-- Left Column -->
          <div class="form-column">
            <div class="field-group">
              <label>PPMP Number</label>
              <input type="text" placeholder="ex. 1">
            </div>
            <div class="field-group">
              <label>Is Indicative or Final?</label>
              <div class="select-wrapper">
                <select><option>Indicative</option><option>Final</option></select>
                <img src="images/vector-19.svg" class="custom-chevron">
              </div>
            </div>
            <div class="field-group">
              <label>End-User or Implementing Unit</label>
              <input type="text" placeholder="Input">
            </div>
            <div class="field-group">
              <label>Fiscal Year</label>
              <input type="text" placeholder="Field text goes here">
            </div>
            <div class="field-group">
              <label>Type of Project to be Procured</label>
              <div class="select-wrapper">
                <select><option>Consulting Services</option><option>Goods</option><option>Infrastructure</option></select>
                <img src="images/vector-33.svg" class="custom-chevron">
              </div>
            </div>
          </div>
          <!-- Right Column -->
          <div class="form-column">
            <div class="field-group">
              <label>Recommended Mode of Procurement</label>
              <div class="select-wrapper error-state">
                <select required><option value="" disabled selected></option></select>
                <img src="images/vector-43.svg" class="custom-chevron">
              </div>
              <p class="text-45">Must Select Mode of Procurement</p>
            </div>
            <div class="field-group">
              <label>Pre Procurement Conference?</label>
              <div class="select-wrapper">
                <select><option>No</option><option>Yes</option></select>
                <img src="images/vector-51.svg" class="custom-chevron">
              </div>
            </div>
            <div class="field-group">
              <label>Quantity and Size of the Project</label>
              <textarea placeholder="Message text goes here" style="height: 150px;"></textarea>
            </div>
          </div>
        </form>
        <div class="footer-actions">
          <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
          <button class="next-btn" onclick="showNextStep()">Next &rarr;</button>
        </div>
      </div>

      <!-- STEP 2: Projected Timeline -->
      <div id="step-2" class="hidden">
        <form class="form-grid">
          <!-- Left Column -->
          <div class="form-column">
            <div class="field-group">
              <label>Start of Procurement Activity</label>
              <div class="input-with-icon">
                <span class="calendar-icon">📅</span>
                <input type="date" class="calendar-input" placeholder="MM/DD">
              </div>
            </div>
            <div class="field-group">
              <label>End of Procurement Activity</label>
              <div class="input-with-icon">
                <span class="calendar-icon">📅</span>
                <input type="date" class="calendar-input" placeholder="MM/DD">
              </div>
            </div>
            <div class="field-group">
              <label>Expected Delivery/ Implementation Period</label>
              <div class="input-with-icon">
                <span class="calendar-icon">📅</span>
                <input type="date" class="calendar-input" placeholder="MM/DD">
              </div>
            </div>
          </div>
          <!-- Right Column -->
          <div class="form-column">
            <div class="field-group">
              <label>Source of Funds</label>
              <input type="text" placeholder="Field text goes here">
            </div>
            <div class="field-group">
              <label>Estimated Budget / Authorized Budgetary Allocation</label>
              <div class="input-with-prefix">
                <span class="prefix">PHP</span>
                <input type="text">
              </div>
            </div>
          </div>
        </form>
        <div class="footer-actions">
          <button class="back-btn" onclick="showStep1()">&larr; Back</button>
          <button class="next-btn" onclick="showStep3()">Next &rarr;</button>
        </div>
      </div>

      <!-- STEP 3: Funding Details -->
      <div id="step-3" class="hidden">
        <div class="form-single-column">
          <div class="field-group"><label>Remarks</label><textarea placeholder="Add notes..." style="height: 180px;"></textarea></div>
          <div class="field-group">
            <label>Attached Supporting Documents</label>
            <div class="upload-zone">
              <p class="upload-text">Drop here to attach or <span class="upload-link">upload</span></p>
              <p class="upload-subtext">Max size: 5GB</p>
            </div>
          </div>
        </div>
        <div class="footer-actions">
          <button class="back-btn" onclick="showStep2()">&larr; Back</button>
          <button class="next-btn" onclick="alert('Submitted!')">Finish &rarr;</button>
        </div>
      </div>

    </div>
  </main>
  <script src="scripts/script.js"></script>
</body>
</html>
