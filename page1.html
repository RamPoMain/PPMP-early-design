<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICT Procurement System</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto|Inter&display=swap" rel="stylesheet">
  <!-- Shared styles first -->
  <link rel="stylesheet" href="resource/base.css">
  
  <!-- Page specific styles -->
  <link rel="stylesheet" href="resource/step1.css">
  <link rel="stylesheet" href="resource/step2.css">
  <link rel="stylesheet" href="resource/step3.css">
</head>
<body>

<div class="wireframe-1-1">
  <header class="header-container">
    <img src="images/header-banner.png" class="header-banner" alt="DICT Header Banner">
  </header>

  <div class="main-card-container">
    <!-- Title Tab -->
    <div class="title-tab-wrapper">
      <div class="node-6">
        <div class="state-layer-7">
          <div class="tab-contents-8">
            <p id="page-title" class="text-9">PROCUREMENT PROJECT DETAILS</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
      <div class="track-4" style="width: 60%; margin: 20px auto;">
        <div id="progress-fill" class="filled-5" style="width: 15%; transition: width 0.3s ease;"></div>
      </div>
    </div>

    <!-- STEP 1: Procurement Project Details -->
    <div id="step-1">
      <form class="form-grid">
        <div class="form-column">
          <div class="field-group">
            <label class="text-11">PPMP Number</label>
            <input type="text" placeholder="ex. 1">
          </div>
          <div class="field-group">
            <label class="text-15">Is Indicative or Final?</label>
            <div class="select-wrapper">
              <select><option>Indicative</option><option>Final</option></select>
              <img src="images/vector-19.svg" class="custom-chevron" />
            </div>
          </div>
          <div class="field-group">
            <label class="text-25">End-User or Implementing Unit</label>
            <input type="text" placeholder="Input">
          </div>
        </div>
        <div class="form-column">
          <div class="field-group">
            <label class="text-39">Recommended Mode of Procurement</label>
            <div class="select-wrapper error-state">
              <select required><option value="" disabled selected>Select mode...</option></select>
              <img src="images/vector-43.svg" class="custom-chevron" />
            </div>
            <p class="text-45">Must Select Mode of Procurement</p>
          </div>
          <div class="field-group">
            <label class="text-35">Quantity and Size of the Project</label>
            <textarea placeholder="Message text goes here" style="height: 120px;"></textarea>
          </div>
        </div>
      </form>
      <div class="footer-actions">
        <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>
        <button type="button" class="next-btn" onclick="showNextStep()">Next &rarr;</button>
      </div>
    </div>

    <!-- STEP 2: Projected Timeline (Hidden by default) -->
    <div id="step-2" class="hidden">
      <form class="form-grid">
        <div class="form-column">
          <div class="field-group">
            <label class="text-11">Start of Procurement Activity</label>
            <div class="input-with-icon">
              <span class="calendar-icon">📅</span>
              <input type="date" placeholder="calendar-input">
            </div>
          </div>
          <div class="field-group">
            <label class="text-11">End of Procurement Activity</label>
            <div class="input-with-icon">
              <span class="calendar-icon">📅</span>
              <input type="date" placeholder="calendar-input">
            </div>
          </div>
          <div class="field-group">
            <label class="text-11">Expected Delivery/ Implementation Period</label>
            <div class="input-with-icon">
              <span class="calendar-icon">📅</span>
              <input type="date" placeholder="calendar-input">
            </div>
          </div>
        </div>
        <div class="form-column">
          <div class="field-group">
            <label class="text-11">Source of Funds</label>
            <input type="text" placeholder="Field text goes here">
          </div>
          <div class="field-group">
            <label class="text-11">Estimated Budget / Authorized Budgetary Allocation</label>
            <div class="input-with-prefix">
              <span class="prefix">PHP</span>
              <input type="text" placeholder="">
            </div>
          </div>
        </div>
      </form>
      <div class="footer-actions">
         <button type="button" class="back-btn" onclick="showStep1()">&larr; Back</button>
        <button type="button" class="next-btn" onclick="showStep3()">Next &rarr;</button>
      </div>
    </div>

    <!-- STEP 3: Funding Details (The New Section) -->
    <div id="step-3" class="hidden">
      <div class="form-single-column">
        
        <div class="field-group">
          <label class="text-11">Remarks</label>
          <textarea class="input-field-36" placeholder="Message text goes here" style="height: 180px;"></textarea>
        </div>

        <div class="field-group" style="margin-top: 20px;">
          <label class="text-11">Attached Supporting Documents</label>
          <div class="upload-zone">
            <div class="upload-content">
              <span class="upload-icon">📤</span>
              <p class="upload-text">Drop here to attach or <span class="upload-link">upload</span></p>
              <p class="upload-subtext">Max size: 5GB</p>
            </div>
          </div>
        </div>

      </div>

      <div class="footer-actions">
         <button type="button" class="back-btn" onclick="showStep2()">&larr; Back</button>
        <button type="button" class="next-btn" onclick="alert('Procurement Request Completed!')">Finish &rarr;</button>
      </div>
    </div>


  </div>
</div>

<!-- JavaScript to switch steps -->
<script src="scripts/script.js"></script>

</body>
</html>
