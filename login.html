<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DICT Procurement - Sign In</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto|Inter&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="resource/base.css">
    <link rel="stylesheet" href="resource/dashboard.css">
    <link rel="stylesheet" href="resource/login.css">
</head>
<body class="login-body">

    <div class="login-topbar">
        <button id="themeToggle" class="db-icon-btn" aria-label="Toggle dark/light mode" title="Toggle theme">
            <svg id="themeIconMoon" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M20 14.5C18.9 15 17.7 15.3 16.5 15.3C11.9 15.3 8.2 11.6 8.2 7C8.2 5.8 8.5 4.6 9 3.5C5.6 4.5 3.2 7.6 3.2 11.3C3.2 15.9 6.9 19.6 11.5 19.6C15.2 19.6 18.3 17.2 19.3 13.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg id="themeIconSun" viewBox="0 0 24 24" width="18" height="18" fill="none" style="display:none;"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 3V5.2M12 18.8V21M21 12H18.8M5.2 12H3M18.1 5.9L16.6 7.4M7.4 16.6L5.9 18.1M18.1 18.1L16.6 16.6M7.4 7.4L5.9 5.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
    </div>

    <div class="login-center">
        <div class="login-wrap">
            <div class="login-card">

                <div class="login-brand">
                    <span class="login-brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
                            <path d="M12 2 L20 6 V14 C20 18.5 16.5 21.2 12 22 C7.5 21.2 4 18.5 4 14 V6 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M8.5 12.2 L11 14.8 L15.5 9.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <h1>Sign in to DICT Procurement</h1>
                    <p>Enter your credentials to access your dashboard.</p>
                </div>

                <div class="login-error" id="loginError">
                    <span>⚠</span>
                    <span id="loginErrorText"></span>
                </div>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="login-field" data-field="email">
                        <label for="loginEmail">Email</label>
                        <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="juan.dc@dict.gov.ph">
                    </div>

                    <div class="login-field" data-field="password">
                        <label for="loginPassword">Password</label>
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password">
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="login-submit">
                        <span id="loginBtnLabel">Sign In</span>
                    </button>

                    <div class="login-forgot">
                        <a href="#">Forgot your password?</a>
                    </div>
                </form>
            </div>

            <p class="login-footer">&copy; <span id="loginYear"></span> DICT Procurement. All rights reserved.</p>
        </div>
    </div>

    <div class="login-toast" id="loginToast"></div>

    <script>document.getElementById('loginYear').textContent = new Date().getFullYear();</script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
